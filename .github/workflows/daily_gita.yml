name: Daily Gita Learning

on:
  schedule:
    - cron: '0 11 * * *'  # Runs at 7 am in the morning
  workflow_dispatch:       

jobs:
  run-gita:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run main script
        run: python main.py
        env:
          GOOGLE_API: ${{ secrets.GOOGLE_API }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          ONE: ${{ secrets.ONE }}
          TWO: ${{ secrets.TWO }}
          THREE: ${{ secrets.THREE }}
          FOUR: ${{ secrets.FOUR }}

      - name: Commit updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add user.json contents.json
          git diff --staged --quiet || git commit -m "chore: daily shloka update [$(date +'%Y-%m-%d')]"
          git pull --rebase origin main
          git push origin main   # ← no rebase needed, already in sync
